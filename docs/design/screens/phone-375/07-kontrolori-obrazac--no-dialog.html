<!doctype html>
<!-- SPARK Admin design export. Board: 07 Kontrolori – deactivate dialog. Size: 375 x 800 px. State: potvrda = false. Static reference only: not production code. -->
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontrolori – uređivanje i potvrda deaktivacije, mobitel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
a{color:#1565C0}a:hover{color:#0D47A1}
:focus-visible{outline:2px solid #1565C0;outline-offset:2px}
svg.i{flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div style="position: relative; width: 375px; min-height: 800px; display: flex; flex-direction: column; overflow: hidden; background: #FFFFFF; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; line-height: 24px; color: #18202B">

<header style="display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 16px 0 6px; border-bottom: 1px solid #E1E5EA">
<a href="07-kontrolori.html" aria-label="Zatvori obrazac i vrati se na kontrolore" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 6px; color: #18202B"><svg class="i" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
<h2 id="kf-title" style="margin: 0; font-size: 18px; line-height: 28px; font-weight: 600; color: #03112D">Uredi kontrolora</h2>
</header>

<form aria-labelledby="kf-title" style="flex: 1; display: flex; flex-direction: column">
<div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #56606E">Sva su polja obavezna.</p>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="k-name" style="font-size: 14px; line-height: 20px; font-weight: 500">Ime</label>
<input id="k-name" type="text" autocomplete="off" value="Marko" style="width: 100%; height: 48px; padding: 0 12px; border: 1px solid #6E7887; border-radius: 6px; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="k-surname" style="font-size: 14px; line-height: 20px; font-weight: 500">Prezime</label>
<input id="k-surname" type="text" autocomplete="off" value="Horvat" style="width: 100%; height: 48px; padding: 0 12px; border: 1px solid #6E7887; border-radius: 6px; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="k-oib" style="font-size: 14px; line-height: 20px; font-weight: 500">OIB</label>
<input id="k-oib" type="text" inputmode="numeric" autocomplete="off" value="12345678901" style="width: 100%; height: 48px; padding: 0 12px; border: 1px solid #6E7887; border-radius: 6px; background: #FFFFFF; font-family: 'IBM Plex Mono', ui-monospace, monospace">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="k-pin" style="font-size: 14px; line-height: 20px; font-weight: 500">PIN</label>
<div style="display: flex; gap: 8px">
<input id="k-pin" type="password" inputmode="numeric" autocomplete="off" aria-describedby="k-pin-help" value="1234" style="width: 120px; height: 48px; padding: 0 12px; border: 1px solid #6E7887; border-radius: 6px; background: #FFFFFF; font-family: 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: 0.2em">
<button type="button" aria-label="Prikaži PIN" aria-pressed="false" style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border: 1px solid #6E7887; border-radius: 6px; background: #FFFFFF; cursor: pointer"><svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0ZM12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0-6 0"></path></svg></button>
</div>
<p id="k-pin-help" style="margin: 0; font-size: 13px; line-height: 18px; color: #56606E">Do 4 znamenke.</p>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; border: 1px solid #E1E5EA; border-radius: 8px">
<div>
<div id="k-active-label" style="font-weight: 500">Aktivan</div>
<div id="k-active-help" style="font-size: 13px; line-height: 18px; color: #56606E">Može se prijaviti i izdavati dnevne karte.</div>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<span aria-hidden="true" style="font-weight: 500">Ne</span>
<button type="button" role="switch" aria-checked="false" aria-labelledby="k-active-label" aria-describedby="k-active-help" style="position: relative; width: 52px; height: 44px; padding: 0; border: 0; background: none; cursor: pointer"><span style="position: absolute; top: 9px; left: 2px; width: 48px; height: 26px; border: 2px solid #6E7887; border-radius: 13px; background: #FFFFFF"></span><span style="position: absolute; top: 14px; left: 7px; width: 16px; height: 16px; border-radius: 8px; background: #56606E"></span></button>
</div>
</div>
</div>

<footer style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border-top: 1px solid #E1E5EA">
<button type="submit" style="height: 48px; border: 0; border-radius: 6px; background: #1565C0; color: #FFFFFF; font-weight: 600; cursor: pointer">Spremi</button>
<button type="button" style="height: 48px; border: 1px solid #6E7887; border-radius: 6px; background: #FFFFFF; font-weight: 600; cursor: pointer">Odustani</button>
</footer>
</form>


</div>
</body>
</html>
