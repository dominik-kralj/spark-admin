<form style="flex: 1; display: flex; flex-direction: column">

</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="p-until" style="font-size: 14px; line-height: 20px; font-weight: 500">Vrijedi do</label>
<input id="p-until" type="text" inputmode="numeric" aria-describedby="p-until-help" value="30.09.2026" style="width: 100%; height: 48px; padding: 0 12px; border: 1px solid #6E7887; border-radius: 6px; background: #FFFFFF">

<input id="p-street" type="text" autocomplete="off" value="Starogradska ulica" style="width: 100%; height: 48px; padding: 0 12px; border: 1px solid #6E7887; border-radius: 6px; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">

</div>
</div>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 12px">

<input id="p-zip" type="text" inputmode="numeric" autocomplete="off" value="10430" style="width: 100%; height: 48px; padding: 0 12px; border: 1px solid #6E7887; border-radius: 6px; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="p-city" style="font-size: 14px; line-height: 20px; font-weight: 500">Mjesto</label>
<input id="p-city" type="text" autocomplete="off" value="Samobor" style="width: 100%; height: 48px; padding: 0 12px; border: 1px solid #6E7887; border-radius: 6px; background: #FFFFFF">

</div>
</div>
