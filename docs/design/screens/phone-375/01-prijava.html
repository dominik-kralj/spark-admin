<!doctype html>
<!-- SPARK Admin design export. Board: 01 Prijava – error. Size: 375 x 667 px. State: pogreska = true. Static reference only: not production code. -->
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prijava – mobitel, s pogreškom</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
a{color:#1565C0}a:hover{color:#0D47A1}
:focus-visible{outline:2px solid #1565C0;outline-offset:2px}
svg.i{flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<main style="width: 375px; min-height: 667px; display: flex; align-items: center; justify-content: center; padding: 24px; background: #FFFFFF; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; line-height: 24px; color: #18202B">
<form aria-labelledby="login-title" style="width: 100%; display: flex; flex-direction: column; gap: 20px">
<h1 id="login-title" style="margin: 0 0 12px; display: flex; align-items: center; gap: 12px; font-size: 26px; line-height: 40px; font-weight: 600; color: #03112D">
<svg viewBox="0 0 32 32" width="40" height="40" aria-hidden="true" style="flex: none"><rect width="32" height="32" rx="7" fill="#03112D"></rect><path d="M7 10.5h2.5v11H7a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2z" fill="#2196F3"></path><path d="M11 10.5h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H11z" fill="#FFFFFF"></path><path d="M15 16l2.5 2.5 5.5-5.3" style="fill: none; stroke: #03112D; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"></path></svg>
<span style="letter-spacing: 0.06em">SPARK</span>
<span style="font-size: 16px; font-weight: 400; color: #56606E">Admin</span>
</h1>


<div role="alert" style="display: flex; align-items: flex-start; gap: 10px; padding: 12px; background: #FDECEA; border: 1px solid #B42318; border-radius: 6px; color: #8E1B16; font-size: 14px; line-height: 20px">
<svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="margin-top: 1px"><path d="M12 12m-10 0a10 10 0 1 0 20 0a10 10 0 1 0-20 0M12 8v4M12 16h.01"></path></svg>
<div><strong style="font-weight: 600">Prijava nije uspjela.</strong> Korisničko ime ili lozinka nisu točni. Provjerite unos i pokušajte ponovno.</div>
</div>


<div style="display: flex; flex-direction: column; gap: 6px">
<label for="login-user" style="font-size: 14px; line-height: 20px; font-weight: 500">Korisničko ime</label>
<input id="login-user" type="text" autocomplete="username" style="width: 100%; height: 48px; padding: 0 12px; border: 1px solid #6E7887; border-radius: 6px; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="login-pass" style="font-size: 14px; line-height: 20px; font-weight: 500">Lozinka</label>
<input id="login-pass" type="password" autocomplete="current-password" style="width: 100%; height: 48px; padding: 0 12px; border: 1px solid #6E7887; border-radius: 6px; background: #FFFFFF">
</div>
<button type="submit" style="height: 48px; margin-top: 4px; border: 0; border-radius: 6px; background: #1565C0; color: #FFFFFF; font-weight: 600; cursor: pointer">Prijava</button>
</form>
</main>
</body>
</html>
