<!doctype html>
<!-- SPARK Admin design export. Board: 10 Korisnici – form (drawer). Size: 560 x 640 px. State: none. Static reference only: not production code. -->
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korisnici – obrazac</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
a{color:#1565C0}a:hover{color:#0D47A1}
:focus-visible{outline:2px solid #1565C0;outline-offset:2px}
svg.i{flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<section role="dialog" aria-modal="true" aria-labelledby="uf-title" style="width: 560px; min-height: 640px; display: flex; flex-direction: column; background: #FFFFFF; border-left: 1px solid #E1E5EA; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; line-height: 20px; color: #18202B">
<header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 16px 16px 24px; border-bottom: 1px solid #E1E5EA">
<h2 id="uf-title" style="margin: 0; font-size: 18px; line-height: 28px; font-weight: 600; color: #03112D">Dodaj korisnika</h2>
<button type="button" aria-label="Zatvori obrazac" style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 0; border-radius: 6px; background: none; cursor: pointer"><svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</header>

<form style="flex: 1; display: flex; flex-direction: column">
<div style="flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; color: #56606E">Sva su polja obavezna.</p>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="u-user" style="font-weight: 500">Korisničko ime</label>
<input id="u-user" type="text" autocomplete="off" value="marin.loncar" style="width: 100%; height: 40px; padding: 0 12px; border: 1px solid #6E7887; border-radius: 6px; background: #FFFFFF">
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="u-name" style="font-weight: 500">Ime</label>
<input id="u-name" type="text" autocomplete="off" value="Marin" style="width: 100%; height: 40px; padding: 0 12px; border: 1px solid #6E7887; border-radius: 6px; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="u-surname" style="font-weight: 500">Prezime</label>
<input id="u-surname" type="text" autocomplete="off" value="Lončar" style="width: 100%; height: 40px; padding: 0 12px; border: 1px solid #6E7887; border-radius: 6px; background: #FFFFFF">
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="u-pass" style="font-weight: 500">Lozinka</label>
<div style="display: flex; gap: 8px">
<input id="u-pass" type="password" autocomplete="new-password" aria-describedby="u-pass-help" style="flex: 1; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid #6E7887; border-radius: 6px; background: #FFFFFF">
<button type="button" aria-label="Prikaži lozinku" aria-pressed="false" style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 1px solid #6E7887; border-radius: 6px; background: #FFFFFF; cursor: pointer"><svg class="i" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0ZM12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0-6 0"></path></svg></button>
</div>
<p id="u-pass-help" style="margin: 0; font-size: 13px; line-height: 18px; color: #56606E">[Pravila za lozinku]. Korisnik se njome prijavljuje u SPARK Admin.</p>
</div>
</div>

<footer style="display: flex; justify-content: flex-end; gap: 12px; padding: 16px 24px; border-top: 1px solid #E1E5EA">
<button type="button" style="height: 40px; padding: 0 16px; border: 1px solid #6E7887; border-radius: 6px; background: #FFFFFF; font-weight: 600; cursor: pointer">Odustani</button>
<button type="submit" style="height: 40px; padding: 0 16px; border: 0; border-radius: 6px; background: #1565C0; color: #FFFFFF; font-weight: 600; cursor: pointer">Spremi</button>
</footer>
</form>
</section>
</body>
</html>
